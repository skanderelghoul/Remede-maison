<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbal Granny 👵</title>
    <style>
        :root { --primary: #5d4037; --accent: #8bc34a; --danger: #d32f2f; --bg: #fdf5e6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; border: 2px solid var(--primary); }
        h1 { color: var(--primary); text-align: center; margin-top: 0; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; text-decoration: none; text-align: center; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .slider-container { margin: 20px 0; text-align: center; }
        .hidden { display: none; }
        .info-box { background: #fffde7; border-left: 5px solid #fbc02d; padding: 15px; margin: 15px 0; }
        .checklist { text-align: left; margin: 20px 0; }
        .checklist label { display: block; margin: 10px 0; cursor: pointer; }
        .warning-screen { text-align: center; color: var(--danger); }
    </style>
</head>
<body>

<div class="card" id="app"></div>

<script>
    let state = { lang: 'fr', step: 'lang', category: '', sub: '' };

    const content = {
        fr: {
            title: "Herbal Granny 👵",
            intro: "Bienvenue mon enfant. Qu'est-ce qui te fait souffrir ?",
            cats: { pain: "Douleurs & Blessures 🤕", digest: "Digestion 🤢", soul: "Sommeil & Stress 😴" },
            emergency: "🛑 STOP ! Ta situation nécessite un avis médical immédiat.",
            callBtn: "📞 Appeler les urgences (15/112)",
            back: "Retour",
            checkConfirm: "Continuer",
            remedyTitle: "Le conseil de Granny 🌿",
            data: {
                pain: {
                    title: "Douleurs Articulaires",
                    safety: "Quelle est l'intensité (0-10) ?",
                    items: ["Douleur depuis plus de 5 jours", "Articulation rouge ou chaude", "Fièvre associée"],
                    remedies: [{ name: "Ajamoda (Céleri)", prep: "1-3g de poudre avec de l'eau chaude, 2x/jour (Source: OMS)." }]
                },
                digest: {
                    title: "Troubles Digestifs",
                    items: ["Sang dans les selles 🩸", "Fièvre élevée 🌡️", "Soif intense / Pas d'urine 💧", "Douleur abdominale aiguë"],
                    subs: {
                        diarrhea: "Diarrhée simple",
                        stress: "Côlon Irritable (Stress/Alimentation)"
                    },
                    remedies: {
                        diarrhea: [{ name: "Kutaja", prep: "1-3g de poudre d'écorce dans l'eau tiède (Source: OMS)." }],
                        stress: [
                            { name: "Mélisse (Stress)", prep: "Infusion de feuilles séchées pour calmer les nerfs." },
                            { name: "Gingembre (Digestion)", prep: "1g de poudre ou infusion de rhizome frais." }
                        ]
                    }
                },
                soul: {
                    title: "Sommeil & Stress",
                    items: ["Je prends des antidépresseurs/somnifères 💊", "Tristesse très profonde 🖤", "Pas dormi depuis 2 nuits 🚫"],
                    remedies: [
                        { name: "Ashvagandha (Stress)", prep: "1-3g de poudre par jour (Source: OMS)." },
                        { name: "Tagara (Sommeil)", prep: "Poudre ou infusion avant le coucher (Source: OMS)." }
                    ]
                }
            }
        },
        en: {
            title: "Herbal Granny 👵",
            intro: "Welcome child. What is bothering you?",
            cats: { pain: "Pain & Injuries 🤕", digest: "Digestion 🤢", soul: "Sleep & Stress 😴" },
            emergency: "🛑 STOP! Your situation requires immediate medical attention.",
            callBtn: "📞 Call Emergency (911/112)",
            back: "Back",
            checkConfirm: "Continue",
            remedyTitle: "Granny's Advice 🌿",
            data: {
                pain: {
                    title: "Joint Pain",
                    safety: "Pain Intensity (0-10)?",
                    items: ["Pain for more than 5 days", "Red or hot joint", "Associated fever"],
                    remedies: [{ name: "Ajamoda (Celery)", prep: "1-3g powder with warm water, 2x/day (Source: WHO)." }]
                },
                digest: {
                    title: "Digestive Issues",
                    items: ["Blood in stools 🩸", "High fever 🌡️", "Intense thirst / No urine 💧", "Acute abdominal pain"],
                    subs: { diarrhea: "Simple Diarrhea", stress: "IBS (Stress/Food)" },
                    remedies: {
                        diarrhea: [{ name: "Kutaja", prep: "1-3g bark powder in warm water (Source: WHO)." }],
                        stress: [
                            { name: "Lemon Balm (Stress)", prep: "Leaf infusion to calm nerves." },
                            { name: "Ginger (Digestion)", prep: "1g powder or fresh rhizome infusion." }
                        ]
                    }
                },
                soul: {
                    title: "Sleep & Stress",
                    items: ["I take antidepressants/sleeping pills 💊", "Very deep sadness 🖤", "No sleep for 2 nights 🚫"],
                    remedies: [
                        { name: "Ashvagandha (Stress)", prep: "1-3g powder daily (Source: WHO)." },
                        { name: "Tagara (Sleep)", prep: "Powder or infusion before bed (Source: WHO)." }
                    ]
                }
            }
        }
    };

    function render() {
        const app = document.getElementById('app');
        const t = content[state.lang];

        if (state.step === 'lang') {
            app.innerHTML = `<h1>${t.title}</h1><button class="btn btn-primary" onclick="state.lang='fr'; state.step='cat'; render()">Français 🇫🇷</button><button class="btn btn-primary" onclick="state.lang='en'; state.step='cat'; render()">English 🇬🇧</button>`;
        } else if (state.step === 'cat') {
            app.innerHTML = `<h1>${t.title}</h1><p>${t.intro}</p>` + Object.keys(t.cats).map(k => `<button class="btn btn-primary" onclick="state.category='${k}'; state.step='${k === 'digest' ? 'sub' : 'safety'}'; render()">${t.cats[k]}</button>`).join('');
        } else if (state.step === 'sub') {
            const subs = t.data.digest.subs;
            app.innerHTML = `<h1>${t.cats.digest}</h1>` + Object.keys(subs).map(k => `<button class="btn btn-primary" onclick="state.sub='${k}'; state.step='safety'; render()">${subs[k]}</button>`).join('');
        } else if (state.step === 'safety') {
            const catData = t.data[state.category];
            let html = `<h1>Sécurité</h1><div class="checklist">`;
            if(state.category === 'pain') html += `<label>${catData.safety}</label><input type="range" id="eva" min="0" max="10" value="0" oninput="document.getElementById('ev').innerText=this.value"> <b id="ev">0</b>`;
            catData.items.forEach((item, i) => { html += `<label><input type="checkbox" class="danger-check"> ${item}</label>`; });
            html += `</div><button class="btn btn-primary" onclick="checkSafety()">${t.checkConfirm}</button>`;
            app.innerHTML = html;
        }
    }

    function checkSafety() {
        const eva = document.getElementById('eva')?.value || 0;
        const checked = document.querySelectorAll('.danger-check:checked').length;
        if (eva >= 7 || checked > 0) {
            const t = content[state.lang];
            document.getElementById('app').innerHTML = `<div class="warning-screen"><h2>${t.emergency}</h2><a href="tel:112" class="btn btn-danger">${t.callBtn}</a><button class="btn btn-primary" onclick="location.reload()">${t.back}</button></div>`;
        } else {
            showRemedy();
        }
    }

    function showRemedy() {
        const t = content[state.lang];
        let rems = state.category === 'digest' ? t.data.digest.remedies[state.sub] : t.data[state.category].remedies;
        document.getElementById('app').innerHTML = `<h1>${t.remedyTitle}</h1>` + rems.map(r => `<div class="info-box"><h3>${r.name}</h3><p>${r.prep}</p></div>`).join('') + `<button class="btn btn-primary" onclick="location.reload()">Merci Granny !</button>`;
    }

    render();
</script>
</body>
</html>
