<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbal Granny 👵</title>
    <style>
        :root {
            --primary: #5d4037;
            --accent: #8bc34a;
            --danger: #d32f2f;
            --bg: #fdf5e6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #333; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; border: 2px solid var(--primary); }
        h1 { color: var(--primary); text-align: center; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .slider-container { margin: 20px 0; text-align: center; }
        input[type=range] { width: 100%; cursor: pointer; }
        .eva-display { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .hidden { display: none; }
        .info-box { background: #fffde7; border-left: 5px solid #fbc02d; padding: 15px; margin: 15px 0; }
        .warning { color: var(--danger); font-weight: bold; border: 2px solid var(--danger); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="card" id="app">
    </div>

<script>
    let lang = 'fr';
    let currentStep = 'lang';
    let selectedCategory = '';
    
    const content = {
        fr: {
            title: "Herbal Granny 👵",
            intro: "Bienvenue mon enfant. Quel mal te tracasse ?",
            safetyTitle: "🚨 Étape de Sécurité",
            evaLabel: "Quelle est l'intensité de ta douleur ? (0 à 10)",
            durationLabel: "La douleur dure-t-elle depuis plus de 5 jours ?",
            inflamLabel: "L'articulation est-elle rouge, chaude ou as-tu de la fièvre ?",
            yes: "Oui", no: "Non",
            emergency: "🛑 STOP ! Ta situation nécessite un avis médical immédiat. Ne prends pas de remède seule.",
            categories: { pain: "Douleurs & Blessures 🤕" },
            subPain: {
                joint: "Douleurs Articulaires",
                sprain: "Entorse",
                wound: "Petite Plaie"
            },
            remedies: {
                joint: { name: "Ajamoda (Poudre de Céleri)", prep: "Prendre 1 à 3g de poudre avec de l'eau chaude, deux fois par jour.", source: "Source : OMS (Traditional Herbal Remedies)" },
                sprain: { name: "Haridra (Pâte de Curcuma)", prep: "Mélanger la poudre avec un peu d'eau pour faire une pâte. Appliquer sur la zone.", source: "Source : OMS" },
                wound: { name: "Haridra (Antiseptique)", prep: "Appliquer la poudre directement sur la plaie nettoyée.", source: "Source : OMS" }
            }
        },
        en: {
            title: "Herbal Granny 👵",
            intro: "Welcome child. What is troubling you?",
            safetyTitle: "🚨 Security Step",
            evaLabel: "How intense is your pain? (0 to 10)",
            durationLabel: "Has the pain lasted for more than 5 days?",
            inflamLabel: "Is the joint red, hot, or do you have a fever?",
            yes: "Yes", no: "No",
            emergency: "🛑 STOP! Your situation requires immediate medical advice. Do not take any herbal remedy.",
            categories: { pain: "Pain & Injuries 🤕" },
            subPain: {
                joint: "Joint Pain",
                sprain: "Sprain",
                wound: "Small Wound"
            },
            remedies: {
                joint: { name: "Ajamoda (Celery Powder)", prep: "Take 1-3g of powder with warm water, twice daily.", source: "Source: WHO (Traditional Herbal Remedies)" },
                sprain: { name: "Haridra (Turmeric Paste)", prep: "Mix powder with water to make a paste. Apply to the area.", source: "Source: WHO" },
                wound: { name: "Haridra (Antiseptic)", prep: "Apply powder directly to the cleaned wound.", source: "Source: WHO" }
            }
        }
    };

    function render() {
        const app = document.getElementById('app');
        const t = content[lang];

        if (currentStep === 'lang') {
            app.innerHTML = `<h1>${t.title}</h1><button class="btn btn-primary" onclick="setLang('fr')">Français 🇫🇷</button><button class="btn btn-primary" onclick="setLang('en')">English 🇬🇧</button>`;
        } 
        else if (currentStep === 'category') {
            app.innerHTML = `<h1>${t.title}</h1><p>${t.intro}</p><button class="btn btn-primary" onclick="setCat('pain')">${t.categories.pain}</button>`;
        }
        else if (currentStep === 'sub-pain') {
            app.innerHTML = `<h1>${t.categories.pain}</h1><button class="btn btn-primary" onclick="setSub('joint')">${t.subPain.joint}</button><button class="btn btn-primary" onclick="setSub('sprain')">${t.subPain.sprain}</button><button class="btn btn-primary" onclick="setSub('wound')">${t.subPain.wound}</button>`;
        }
        else if (currentStep === 'safety') {
            app.innerHTML = `
                <h1>${t.safetyTitle}</h1>
                <div class="slider-container">
                    <label>${t.evaLabel}</label><br>
                    <input type="range" id="eva" min="0" max="10" value="0" oninput="updateEva(this.value)">
                    <div id="evaVal" class="eva-display" style="color: green">0</div>
                </div>
                <p>${t.durationLabel}</p>
                <button class="btn btn-primary" onclick="isEmergency()">Oui</button>
                <button class="btn btn-primary" onclick="checkInflam()">Non</button>
            `;
        }
    }

    function setLang(l) { lang = l; currentStep = 'category'; render(); }
    function setCat(c) { selectedCategory = c; currentStep = 'sub-pain'; render(); }
    function setSub(s) { selectedSub = s; currentStep = 'safety'; render(); }
    
    function updateEva(val) {
        const display = document.getElementById('evaVal');
        display.innerText = val;
        display.style.color = val < 4 ? 'green' : (val < 7 ? 'orange' : 'red');
        if (val >= 7) isEmergency();
    }

    function isEmergency() {
        const t = content[lang];
        document.getElementById('app').innerHTML = `<div class="warning">${t.emergency}</div><button class="btn btn-primary" onclick="location.reload()">Retour</button>`;
    }

    function checkInflam() {
        const t = content[lang];
        document.getElementById('app').innerHTML = `
            <h1>${t.safetyTitle}</h1>
            <p>${t.inflamLabel}</p>
            <button class="btn btn-danger" onclick="isEmergency()">${t.yes}</button>
            <button class="btn btn-primary" onclick="showRemedy()">${t.no}</button>
        `;
    }

    function showRemedy() {
        const t = content[lang];
        const rem = t.remedies[selectedSub];
        document.getElementById('app').innerHTML = `
            <h1>🌿 ${rem.name}</h1>
            <div class="info-box"><p>${rem.prep}</p><small>${rem.source}</small></div>
            <button class="btn btn-primary" onclick="location.reload()">Merci Granny !</button>
        `;
    }

    render();
</script>
</body>
</html>
